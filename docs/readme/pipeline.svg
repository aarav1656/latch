one!important}.rm-hide{display:none}}</style><rect width="1200" height="330" rx="8" fill="#24201d"/><text x="48" y="52" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="500" text-anchor="start" letter-spacing="1.5">MODELS PROPOSE</text><text x="725.0" y="52" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#dfe86a" font-weight="600" text-anchor="start" letter-spacing="1.5">THE HARNESS DECIDES</text><line x1="711.0" y1="36" x2="711.0" y2="300" stroke="#dfe86a" stroke-width="1" stroke-dasharray="3 5" opacity=".7"/><rect x="48" y="80" width="196" height="150" rx="4" fill="#2e2925" stroke="#4a433d" stroke-width="1.5" class="c1"/><text x="66" y="108" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="400" text-anchor="start">01</text><text x="66" y="142" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f4efe4" font-weight="650" text-anchor="start">Issue + PR</text><text x="66" y="174" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">the issue is the oracle</text><text x="66" y="194" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">base and head commits</text><g class="c2"><line x1="246" y1="155" x2="268" y2="155" stroke="#dfe86a" stroke-width="2"/><path d="M266 149 l7 6 l-7 6" fill="none" stroke="#dfe86a" stroke-width="2"/></g><rect x="274" y="80" width="196" height="150" rx="4" fill="#2e2925" stroke="#4a433d" stroke-width="1.5" class="c3"/><text x="292" y="108" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="400" text-anchor="start">02</text><text x="292" y="142" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f4efe4" font-weight="650" text-anchor="start">Lightning</text><text x="292" y="174" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">maps the repo, triages</text><text x="292" y="194" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">the base failure</text><text x="292" y="218" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#b2a998" font-weight="400" text-anchor="start">Nemotron-3.5-Lightning</text><g class="c4"><line x1="472" y1="155" x2="494" y2="155" stroke="#dfe86a" stroke-width="2"/><path d="M492 149 l7 6 l-7 6" fill="none" stroke="#dfe86a" stroke-width="2"/></g><rect x="500" y="80" width="196" height="150" rx="4" fill="#2e2925" stroke="#4a433d" stroke-width="1.5" class="c5"/><text x="518" y="108" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="400" text-anchor="start">03</text><text x="518" y="142" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f4efe4" font-weight="650" text-anchor="start">Ultra</text><text x="518" y="174" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">writes one pytest</text><text x="518" y="194" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">from the issue and diff</text><text x="518" y="218" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#b2a998" font-weight="400" text-anchor="start">Nemotron-3-Ultra 550B</text><g class="c6"><line x1="698" y1="155" x2="720" y2="155" stroke="#dfe86a" stroke-width="2"/><path d="M718 149 l7 6 l-7 6" fill="none" stroke="#dfe86a" stroke-width="2"/></g><rect x="726" y="80" width="196" height="150" rx="4" fill="#2e2925" stroke="#4a433d" stroke-width="1.5" class="c7"/><text x="744" y="108" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="400" text-anchor="start">04</text><text x="744" y="142" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f4efe4" font-weight="650" text-anchor="start">Harness</text><text x="744" y="174" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">base, head, revert,</text><text x="744" y="194" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">mutants, 5x rerun</text><text x="744" y="218" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#dfe86a" font-weight="400" text-anchor="start">no model</text><g class="c8"><line x1="924" y1="155" x2="946" y2="155" stroke="#dfe86a" stroke-width="2"/><path d="M944 149 l7 6 l-7 6" fill="none" stroke="#dfe86a" stroke-width="2"/></g><rect x="952" y="80" width="196" height="150" rx="4" fill="#2e2925" stroke="#4a433d" stroke-width="1.5" class="c9"/><text x="970" y="108" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#948b7c" font-weight="400" text-anchor="start">05</text><text x="970" y="142" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#f4efe4" font-weight="650" text-anchor="start">Receipt</text><text x="970" y="174" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">one named verdict</text><text x="970" y="194" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#d8d0c0" font-weight="400" text-anchor="start">and the PR comment</text><text x="970" y="218" font-family="'Azeret Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#dfe86a" font-weight="400" text-anchor="start">JSON, every call logged</text><g class="c10"><text x="48" y="290" font-family="'Mona Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#b2a998" font-weight="400" text-anchor="start">A model response alone never opens the gate. A timeout, import error or crash leaves the receipt unproven.</text></g></svg>
